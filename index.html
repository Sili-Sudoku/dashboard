<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f6efe0" />
    <title>Sili Sudoku</title>
    <meta
      name="description"
      content="Play and author Sudoku variants (thermometers, killer cages, arrows, kropki dots) where every variant is a small swappable definition, not a built-in feature. Imports from f-puzzles and SudokuMaker."
    />
    <!-- Link-preview cards. og:image, og:url, and canonical must be absolute URLs. They are
         omitted until a production domain exists. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sili Sudoku" />
    <meta property="og:title" content="Sili Sudoku" />
    <meta
      property="og:description"
      content="Play and author Sudoku variants (thermometers, killer cages, arrows, kropki dots) where every variant is a small swappable definition, not a built-in feature. Imports from f-puzzles and SudokuMaker."
    />
    <meta name="twitter:card" content="summary" />
    <!-- Sets data-theme and data-palette before first paint, so the wrong look does not flash while React
         mounts. It is a file, not inline, so the Content-Security-Policy needs no exception for inline scripts. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
