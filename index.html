<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f6efe0" />
    <title>Constraint Puzzle Runtime</title>
    <meta name="description" content="Play and author Sudoku variants (thermometers, killer cages, arrows, kropki dots) where every variant is a small swappable definition, not a built-in feature. Imports from f-puzzles and SudokuMaker." />
    <!-- Link-preview cards. og:image / og:url / canonical must be absolute URLs, so
         they're left out until there's a production domain (#150). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Constraint Puzzle Runtime" />
    <meta property="og:title" content="Constraint Puzzle Runtime" />
    <meta property="og:description" content="Play and author Sudoku variants (thermometers, killer cages, arrows, kropki dots) where every variant is a small swappable definition, not a built-in feature. Imports from f-puzzles and SudokuMaker." />
    <meta name="twitter:card" content="summary" />
    <!-- Sets data-theme before first paint, so there's no flash of the wrong
         theme while React mounts (see src/app/use_theme.ts for the React side). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("cpr:theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          // storage/matchMedia unavailable — the "light" attribute below stands.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
